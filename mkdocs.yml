site_name: TransformPlan
site_description: Safe, reproducible data transformations with built-in auditing and validation
site_url: https://github.com/limebit/transformplan
repo_url: https://github.com/limebit/transformplan
repo_name: TransformPlan

theme:
  name: material
  logo: https://raw.githubusercontent.com/limebit/transformplan-static/refs/heads/main/logos/logo_wordmark_white.png
  favicon: https://raw.githubusercontent.com/limebit/transformplan-static/refs/heads/main/logos/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - assets/stylesheets/custom.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 80

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - API Reference:
      - Overview: api/index.md
      - TransformPlan: api/plan.md
      - Backends: api/backends.md
      - Filters: api/filters.md
      - Protocol: api/protocol.md
      - Chunked Processing: api/chunking.md
      - Validation: api/validation.md
      - Operations:
          - Column Operations: api/ops/column.md
          - Math Operations: api/ops/math.md
          - Row Operations: api/ops/rows.md
          - String Operations: api/ops/string.md
          - Datetime Operations: api/ops/datetime.md
          - Map Operations: api/ops/map.md
