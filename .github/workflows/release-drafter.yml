name: Release Drafter

on:
  push:
    branches: [main]

concurrency:
  group: release-drafter
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Draft release
        uses: release-drafter/release-drafter@v6
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
